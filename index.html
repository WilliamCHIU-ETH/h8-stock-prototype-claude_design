<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>H8 圖像型個股頁｜互動 Prototype</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="prototype-host.css">
</head>
<body>
  <main class="prototype-host">
    <header class="prototype-toolbar">
      <div class="prototype-title">
        <strong>H8 個股判讀原型</strong>
        <span id="versionMapping">V5 · Contextual Card Flow Candidate</span>
      </div>

      <nav class="version-switch" aria-label="切換設計版本">
        <button type="button" data-version="v5" aria-pressed="true">UX Flow</button>
        <button type="button" data-version="v4" aria-pressed="false">Lite Demo</button>
        <button type="button" data-version="v3" aria-pressed="false">Simple IA</button>
        <button type="button" data-version="v2" aria-pressed="false">V2</button>
        <button type="button" data-version="v1" aria-pressed="false">V1</button>
      </nav>

      <a class="direct-link" id="directLink" href="versions/version-neutral-light-v5.html" target="_blank" rel="noreferrer">
        單獨開啟
      </a>
    </header>

    <section class="prototype-stage" aria-label="H8 Prototype 預覽">
      <div class="stage-inner">
        <div class="phone-frame">
          <iframe
            id="prototypeFrame"
            src="versions/version-neutral-light-v5.html"
            title="H8 Contextual Card Flow Candidate"
            loading="eager"
          ></iframe>
        </div>

        <aside class="annotations" aria-label="設計註解（僅桌機檢視）">
          <div class="anno-head" id="annotationTitle">設計註解 · 桌機檢視</div>
          <p class="anno-sub" id="annotationSummary">這些說明只在電腦寬螢幕出現；手機開啟時看不到，維持乾淨的 App 體驗。</p>
          <ol class="anno-list" id="annotationList"></ol>
          <p class="anno-foot" id="annotationFoot"></p>
        </aside>
      </div>
    </section>

    <div class="host-toast" id="hostToast" role="status" aria-live="polite"></div>
  </main>
  <script src="prototype-host.js"></script>
</body>
</html>
