<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>股票 A｜V5 Contextual UX Flow</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../neutral-prototype-v5.css">
</head>
<body data-page-theme="light">
  <div class="app" id="appRoot">
    <header class="topbar">
      <button class="icon-btn" id="backButton" type="button" aria-label="返回版本切換器">‹</button>
      <div class="top-title"><strong>股票 A</strong><span>個股首頁</span></div>
      <button class="icon-btn" id="moreButton" type="button" aria-label="更多選項">⋯</button>
    </header>

    <main id="stockHome">
      <section class="stock-head" aria-label="股票 A 觀察狀態">
        <div>
          <div class="stock-id"><h1>股票 A</h1><span>SIM-A</span></div>
          <div class="observation"><small>目前觀察狀態</small><strong>多方訊號形成中</strong></div>
        </div>
      </section>

      <section class="verdict" aria-label="股票 A 綜合判讀">
        <small>綜合判讀</small>
        <div class="verdict-row"><strong>多方轉強</strong><span class="verdict-count">2 已出現 · 1 待確認</span></div>
        <span class="verdict-note">籌碼先出現變化，價格已有反應，量能仍需後續確認。</span>
      </section>

      <section class="path-section" aria-labelledby="pathTitle">
        <div class="section-head section-head--path">
          <div><strong id="pathTitle">判讀路徑</strong><span>三個面向如何接在一起</span></div>
        </div>
        <ol class="signal-path" aria-label="籌碼、價格、量能的判讀順序">
          <li class="is-confirmed"><span>01</span><b>籌碼動向</b><small>持續增加</small></li>
          <li class="is-confirmed"><span>02</span><b>價格位置</b><small>已有反應</small></li>
          <li class="is-pending"><span>03</span><b>量能確認</b><small>尚待確認</small></li>
        </ol>
      </section>

      <section class="rail-section" aria-labelledby="railTitle">
        <div class="section-head">
          <div><strong id="railTitle">三個判讀面向</strong><span>點卡片進入；左右滑動預覽</span></div>
          <span class="swipe-label" aria-hidden="true">左右滑動</span>
        </div>

        <div class="signal-rail" id="signalRail" role="region" aria-label="三個判讀面向，可左右滑動或使用方向鍵瀏覽；點卡片進入對應頁面">
          <button class="signal-card" type="button" data-rail-index="0" data-reel-target="0">
            <div class="signal-card-head"><span>資訊候選 A｜籌碼動向</span><i></i></div>
            <div class="mini-diagram chip-diagram" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <strong>法人籌碼持續增加</strong>
            <p>主要參與者買盤延續，持股分布逐漸集中。</p>
            <span class="card-entry">進入查看 <span aria-hidden="true">›</span></span>
          </button>

          <button class="signal-card" type="button" data-rail-index="1" data-reel-target="1">
            <div class="signal-card-head"><span>資訊候選 B｜價格位置</span><i></i></div>
            <div class="mini-diagram price-diagram" aria-hidden="true"><span></span></div>
            <strong>價格位於短期參考區上方</strong>
            <p>價格維持在近期區間偏上位置，暫未回到整理區。</p>
            <span class="card-entry">進入查看 <span aria-hidden="true">›</span></span>
          </button>

          <button class="signal-card signal-card--pending" type="button" data-rail-index="2" data-reel-target="2">
            <div class="signal-card-head"><span>資訊候選 C｜尚待確認</span><i class="is-pending"></i></div>
            <div class="mini-diagram volume-diagram" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <strong>成交量尚未明顯擴大</strong>
            <p>市場參與程度仍接近常態，這是目前最需要留意的部分。</p>
            <span class="card-entry">查看疑點 <span aria-hidden="true">›</span></span>
          </button>
        </div>

        <div class="rail-dots" aria-hidden="true">
          <span class="is-on"></span><span></span><span></span>
        </div>
      </section>
    </main>
  </div>

  <dialog id="sourceDialog" aria-labelledby="sourceTitle">
    <div class="dialog-head">
      <strong id="sourceTitle">資料說明</strong>
      <button class="dialog-close" type="button" aria-label="關閉">×</button>
    </div>
    <div class="dialog-body">此頁以股票 A 示範一段可替換的判讀故事：籌碼先出現變化、價格已有反應、量能尚待確認。頁面只測試個股首頁到判讀流程的理解，不代表特定公司或交易建議。</div>
  </dialog>

  <script src="../neutral-prototype-v5.js"></script>
</body>
</html>
